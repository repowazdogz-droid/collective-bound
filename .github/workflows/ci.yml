name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install z3-solver 4.16.0 and numpy
        run: python -m pip install -r z3/requirements.txt
      - name: Install elan (Lean version comes from lean/lean-toolchain)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.2.1/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Lean build, axiom audit, Z3 records, negative controls
        run: make all
      - name: Axiom audit must report six axiom-free theorems
        run: test "$(cd lean && lake env lean Axioms.lean | grep -c 'does not depend on any axioms')" = 6
